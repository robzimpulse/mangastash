name: Windows Pipeline

on:
  # ref: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: windows-pipeline-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: 'Git Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - name: 'Install Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          # ref: https://github.com/subosito/flutter-action/issues/350
          cache: true
      - name: 'Install Melos'
        run: flutter pub global activate melos 6.2.0
      - name: 'Install Dependency'
        run: melos get
      - name: 'Build Application'
        run: flutter build windows --release
      - name: 'Compress Build'
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build-windows.zip
      - name: 'Save Artifact'
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build-windows.zip
      - name: 'Attach artifact to release tag'
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build-windows.zip