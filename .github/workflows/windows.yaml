name: Windows Pipeline

on:
  # ref: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:
    types: [opened, reopened, synchronize]
  # ref: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: windows-pipeline-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - name: 'Git Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - name: 'Install Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          # ref: https://github.com/subosito/flutter-action/issues/350
          cache: true
      - name: 'Install Melos'
        run: flutter pub global activate melos 6.2.0
      - name: 'Install Dependency'
        run: melos get
      # Flutter 3.32.8's VisualStudio.cmakeGenerator only maps VS major 17 to 'Visual Studio
      # 17 2022'; every other major falls back to 'Visual Studio 16 2019'. windows-latest now
      # ships VS 2026 (major 18), so Flutter emits the VS 2019 generator and CMake finds no
      # instance. Patch the generator mapping to add VS 2026, then touch flutter_tools'
      # pubspec.yaml so the flutter bootstrap recompiles its snapshot with the patch applied.
      - name: 'Patch Flutter generator mapping for VS 2026'
        run: |
          $vs = Join-Path $env:FLUTTER_ROOT 'packages\flutter_tools\lib\src\windows\visual_studio.dart'
          $content = Get-Content $vs -Raw
          $replacement = "`$1`n      18 => 'Visual Studio 18 2026',`$2`$3"
          $content = $content -replace "(17 => 'Visual Studio 17 2022',)(\s+)(_ => 'Visual Studio 16 2019',)", $replacement
          Set-Content $vs $content -NoNewline
          if (-not (Select-String -Path $vs -Pattern "18 => 'Visual Studio 18 2026'" -Quiet)) { Write-Error 'generator patch failed'; exit 1 }
          (Get-Item (Join-Path $env:FLUTTER_ROOT 'packages\flutter_tools\pubspec.yaml')).LastWriteTime = Get-Date
      - name: 'Build Application'
        run: flutter build windows --release
      - name: 'Compress Build'
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build-windows.zip
      - name: 'Save Artifact'
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: build-windows.zip
      - name: 'Attach artifact to release tag'
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build-windows.zip
      - name: 'Find Comment'
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Windows Build Report
      - name: 'Create or Update Comment'
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 🚀 Windows Build Report

            | Item | Details |
            | :--- | :--- |
            | **Build Status** | ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }} |
            | **Event** | ${{ github.event_name }} |
            | **Run ID** | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Download Artifacts** | [📂 Click Here to Download](${{ steps.upload_artifact.outputs.artifact-url }}) |