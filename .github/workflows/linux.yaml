name: Linux Pipeline

on:
  # ref: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push
  push:
    tags:
      - 'v*.*.*'
concurrency:
  group: linux-pipeline-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: 'Git Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - name: 'Install Linux Dependencies'
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: 'Install Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          # ref: https://github.com/subosito/flutter-action/issues/350
          cache: true
      - name: 'Install Melos'
        run: flutter pub global activate melos 6.2.0
      - name: 'Install Dependency'
        run: melos get
      - name: 'Build Application'
        run: flutter build linux --release
      - name: 'Compress Build'
        run: tar -czf mangastash-Linux.tar.gz -C build/linux/x64/release/bundle .
      - name: 'Save Artifact'
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: build/linux/x64/release/bundle/build-linux.tar.gz
      - name: 'Attach artifact to release tag'
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/linux/x64/release/bundle/build-linux.tar.gz