name: entity_manga
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.5
  collection: ^1.16.0
  json_annotation: ^4.11.0

  # core
  core_environment:
    path: ../../core/core_environment

  # library
  manga_dex_api:
    path: ../../library/manga_dex_api
  manga_service_drift:
    path: ../../library/manga_service_drift
  entity_manga_external:
    path: ../../library/entity_manga_external

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: 2.15.1
  json_serializable: 6.13.0
  # source_helper 1.4.0 adds `DartTypeExtension.toStringNonNullable`, which
  # collides with json_serializable 6.13.0's own extension of the same name
  # and breaks the builder compile; 1.3.13 is the last version without it.
  source_helper: 1.3.13
