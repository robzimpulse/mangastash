name: manga_dex_api
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.11.0
  dio: ^5.7.0
  equatable: ^2.0.5
  # codegen pins are exact and shared with entity_manga / manga_service_drift;
  # capped by drift_dev 2.31.0 (analyzer < 11), see #198
  retrofit: 4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  json_serializable: 6.13.0
  # source_helper 1.4.0 adds `DartTypeExtension.toStringNonNullable`, which
  # collides with json_serializable 6.13.0's own extension of the same name
  # and breaks the builder compile; 1.3.13 is the last version without it.
  source_helper: 1.3.13
  flutter_lints: ^5.0.0
  retrofit_generator: 10.3.2
  mocktail: ^1.0.4
