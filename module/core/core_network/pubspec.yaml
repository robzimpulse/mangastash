name: core_network
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0
  mutex: ^3.1.0
  universal_io: ^2.2.2
  flutter_inappwebview: ^6.1.0
  equatable: ^2.0.5
  crypto: ^3.0.6

  # core
  core_analytics:
    path: ../../core/core_analytics
  core_storage:
    path: ../core_storage
  core_environment:
    path: ../core_environment

  # library
  service_locator:
    path: ../../library/service_locator
  manga_service_drift:
    path: ../../library/manga_service_drift

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  # Shared JS `ctx` helpers injected next to every source script
  # (assets/source_ctx.js); loaded via rootBundle as
  # 'packages/core_network/assets/source_ctx.js'.
  assets:
    - assets/
