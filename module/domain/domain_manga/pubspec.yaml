name: domain_manga
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.16.0
  equatable: ^2.0.5
  rxdart: ^0.28.0
  universal_io: ^2.2.2
  file: ^7.0.0
  uuid: ^4.5.1

  # core
  core_analytics:
    path: ../../core/core_analytics
  core_network:
    path: ../../core/core_network
  core_environment:
    path: ../../core/core_environment
  core_storage:
    path: ../../core/core_storage

  # entity
  entity_manga:
    path: ../../entity/entity_manga

  # library
  service_locator:
    path: ../../library/service_locator
  manga_dex_api:
    path: ../../library/manga_dex_api
  entity_manga_external:
    path: ../../library/entity_manga_external

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  manga_service_drift:
    path: ../../library/manga_service_drift

flutter:
  # Shipped JS source scripts (assets/sources/*.js) and the AI-prompt assets.
  assets:
    - assets/sources/
    - assets/prompt/
