name: feature_browse
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # library
  safe_bloc:
    path: ../../library/safe_bloc
  service_locator:
    path: ../../library/service_locator

  # entity
  entity_manga:
    path: ../../entity/entity_manga

  # domain
  domain_manga:
    path: ../../domain/domain_manga

  # core
  core_route:
    path: ../../core/core_route
  core_network:
    path: ../../core/core_network
  core_environment:
    path: ../../core/core_environment

  # feature
  feature_common:
    path: ../../feature/feature_common
  # Navigates to MoreRoutePath.sourceEditor from the "Fix source" action
  # (issue #115); feature_more depends only on feature_common, so no cycle.
  feature_more:
    path: ../../feature/feature_more

  # ui
  ui_browse:
    path: ../../ui/ui_browse

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
