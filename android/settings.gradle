pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.10.1' apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.4" apply false
    // Crashlytics Gradle plugin: uploads release mapping files for deobfuscated
    // stack traces (issue #190). 3.0.4 = latest stable 3.0.x, needs Gradle 7.5+ / AGP 7+.
    id "com.google.firebase.crashlytics" version "3.0.4" apply false
    // END: FlutterFire Configuration
    // Kotlin 2.x required by firebase_core 4.15.0's compilerOptions() KGP API (#190);
    // 2.1.0 = Flutter 3.32-era template default, compatible with AGP 8.10.1 / Gradle 8.12.
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ':app'